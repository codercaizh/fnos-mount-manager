name: Test, build and release fnOS FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go, browser and dual-arch packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:sdk
      - name: Go tests + race detector + vet
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...
          go test ./... -coverprofile=dist-coverage.out -count=1
      - name: JavaScript syntax and browser smoke tests
        run: |
          npm run test:syntax
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Official fnpack (checksum validated)
        run: |
          mkdir -p dist
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o dist/fnpack-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  dist/fnpack-linux-amd64" | sha256sum -c -
          chmod 755 dist/fnpack-linux-amd64
      - name: Download and verify pinned rclone binaries
        run: bash scripts/fetch-rclone.sh
      - name: Build ARM64 and x86_64 FPK
        run: bash scripts/build.sh
      - name: Verify platform, ELF and package checksums
        run: python3 scripts/verify-fpk.py
      - uses: actions/upload-artifact@v4
        with:
          name: nas-toolbox-fpk
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nas-toolbox-fpk
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists (manual publication); skipping duplicate creation."
            exit 0
          fi
          gh release create "$REF_NAME" release/*.fpk release/*.fpk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NAS Toolbox $REF_NAME" \
            --notes "NAS Toolbox: folder mapping + rclone copying, ARM64 and x86_64 FPKs. Verify SHA-256 and test on your fnOS device. / NAS 工具箱：目录映射 + 快速复制，双架构安装包；升级挂载管家请直接覆盖安装，不要卸载以免丢失配置。"
